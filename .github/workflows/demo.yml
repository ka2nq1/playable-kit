# Builds demo/ from the kit's current files and publishes it to GitHub Pages on every push to main.
# The demo imports the editor, the lab's effects and the adapters straight from this repo
# (demo/vite.config.ts), so any change to the kit is in the next deployed demo.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: demo
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: demo
        env:
          DEMO_BASE: /playable-kit/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
